<form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="auth-form__field">
    <label for="reset-password-password" i18n="@@auth.resetPassword.field.password.label"
      >Nueva contraseña <span aria-hidden="true">*</span></label
    >
    <div class="auth-form__input">
      <tui-icon icon="@tui.lock" aria-hidden="true" />
      <input
        id="reset-password-password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        [attr.aria-invalid]="!!errorFor('password')"
        [attr.aria-describedby]="errorFor('password') ? 'reset-password-password-error' : 'reset-password-password-hint'"
      />
    </div>
    @if (errorFor('password'); as message) {
      <p class="auth-form__error" id="reset-password-password-error">{{ message }}</p>
    } @else {
      <p class="auth-form__hint" id="reset-password-password-hint" i18n="@@auth.resetPassword.field.password.hint">
        Al menos 8 caracteres, con una letra y un número.
      </p>
    }
  </div>

  <div class="auth-form__field">
    <label for="reset-password-confirmPassword" i18n="@@auth.resetPassword.field.confirmPassword.label"
      >Confirmar contraseña <span aria-hidden="true">*</span></label
    >
    <div class="auth-form__input">
      <tui-icon icon="@tui.lock" aria-hidden="true" />
      <input
        id="reset-password-confirmPassword"
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
        [attr.aria-invalid]="!!errorFor('confirmPassword')"
        [attr.aria-describedby]="errorFor('confirmPassword') ? 'reset-password-confirmPassword-error' : null"
      />
    </div>
    @if (errorFor('confirmPassword'); as message) {
      <p class="auth-form__error" id="reset-password-confirmPassword-error">{{ message }}</p>
    }
  </div>

  <button tuiButton type="submit" size="l" [disabled]="pending()" class="auth-form__submit">
    {{ submitLabel() }}
  </button>
</form>

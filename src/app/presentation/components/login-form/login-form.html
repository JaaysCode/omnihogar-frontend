@if (formError(); as message) {
  <div class="form-error-banner" role="alert">{{ message }}</div>
}

<form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="auth-form__field">
    <label for="login-email">Email <span aria-hidden="true">*</span></label>
    <div class="auth-form__input">
      <tui-icon icon="@tui.mail" aria-hidden="true" />
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        [attr.aria-invalid]="!!errorFor('email')"
        [attr.aria-describedby]="errorFor('email') ? 'login-email-error' : null"
      />
    </div>
    @if (errorFor('email'); as message) {
      <p class="auth-form__error" id="login-email-error">{{ message }}</p>
    }
  </div>

  <div class="auth-form__field">
    <label for="login-password">Password <span aria-hidden="true">*</span></label>
    <div class="auth-form__input">
      <tui-icon icon="@tui.lock" aria-hidden="true" />
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="!!errorFor('password')"
        [attr.aria-describedby]="errorFor('password') ? 'login-password-error' : null"
      />
    </div>
    @if (errorFor('password'); as message) {
      <p class="auth-form__error" id="login-password-error">{{ message }}</p>
    }
  </div>

  <button tuiButton type="submit" size="l" [disabled]="pending()" class="auth-form__submit">
    {{ pending() ? 'Signing in…' : 'Sign in' }}
  </button>
</form>

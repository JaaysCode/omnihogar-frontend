<header class="public-header">
  <a routerLink="/products" class="public-header__brand">OmniHogar</a>

  <nav class="public-header__actions" aria-label="Cuenta" i18n-aria-label="@@publicHeader.ariaLabel">
    @if (isAuthenticated()) {
      <a routerLink="/cart" class="public-header__cart" aria-label="Carrito" i18n-aria-label="@@publicHeader.cart">
        <tui-icon icon="@tui.shopping-cart" aria-hidden="true" />
        @if (cartCount() > 0) {
          <span class="public-header__cart-badge">{{ cartCount() }}</span>
        }
      </a>
      @if (isEmployee()) {
        <a routerLink="/admin/dashboard" tuiButton size="s" appearance="secondary" i18n="@@publicHeader.adminArea">
          Panel de administración
        </a>
      }
      <button
        type="button"
        tuiButton
        size="s"
        appearance="flat"
        iconStart="@tui.user"
        [tuiDropdown]="accountMenu"
        [(tuiDropdownOpen)]="menuOpen"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Mi cuenta"
        i18n-aria-label="@@publicHeader.account"
      ></button>
      <ng-template #accountMenu>
        <tui-data-list>
          <a tuiOption routerLink="/profile" (click)="menuOpen.set(false)">
            <tui-icon icon="@tui.user" aria-hidden="true" />
            <span i18n="@@publicHeader.profile">Mi perfil</span>
          </a>
          <a tuiOption routerLink="/my-orders" (click)="menuOpen.set(false)">
            <tui-icon icon="@tui.clipboard-list" aria-hidden="true" />
            <span i18n="@@publicHeader.myOrders">Mis Compras</span>
          </a>
          <a tuiOption routerLink="/chat" (click)="menuOpen.set(false)">
            <tui-icon icon="@tui.message-circle" aria-hidden="true" />
            <span i18n="@@publicHeader.chat">Asistente de compras</span>
          </a>
          <button tuiOption type="button" (click)="onLogout()">
            <tui-icon icon="@tui.log-out" aria-hidden="true" />
            <span i18n="@@publicHeader.logout">Cerrar sesión</span>
          </button>
        </tui-data-list>
      </ng-template>
    } @else {
      <a routerLink="/login" tuiButton size="s" appearance="flat" i18n="@@publicHeader.login">Iniciar sesión</a>
      <a routerLink="/register" tuiButton size="s" appearance="secondary" i18n="@@publicHeader.register">Crear cuenta</a>
    }
  </nav>
</header>

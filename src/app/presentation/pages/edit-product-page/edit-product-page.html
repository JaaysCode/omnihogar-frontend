<div class="product-edit-modal">
  <button
    type="button"
    class="product-edit-modal__backdrop"
    (click)="close()"
    aria-label="Cerrar"
    i18n-aria-label="@@products.edit.close"
  ></button>

  <div class="product-edit-modal__panel" role="dialog" aria-modal="true" aria-labelledby="product-edit-modal-title" tabindex="-1" #panel>
    <header class="product-edit-modal__header">
      <h1 id="product-edit-modal-title" i18n="@@products.edit.title">Editar producto</h1>
      <button type="button" class="product-edit-modal__close" (click)="close()" aria-label="Cerrar" i18n-aria-label="@@products.edit.close">
        <tui-icon icon="@tui.x" aria-hidden="true" />
      </button>
    </header>

    <div class="product-edit-modal__body">
      @if (loadError(); as message) {
        <div class="form-error-banner" role="alert">{{ message }}</div>
      } @else if (!product()) {
        <p class="product-edit-modal__caption" i18n="@@products.edit.loading">Cargando producto…</p>
      } @else {
        <p class="product-edit-modal__caption" i18n="@@products.edit.caption">Modifica los datos y guarda los cambios.</p>
        @if (formError(); as message) {
          <div class="form-error-banner" role="alert">{{ message }}</div>
        }
        <app-product-form
          [initial]="product()"
          [categories]="categories()"
          [pending]="pending()"
          [fieldErrors]="fieldErrors()"
          (submitted)="onSubmit($event)"
        />
      }
    </div>
  </div>
</div>
